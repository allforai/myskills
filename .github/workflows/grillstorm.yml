name: Grillstorm

on:
  push:
    paths:
      - ".github/workflows/grillstorm.yml"
      - ".claude-plugin/marketplace.json"
      - "claude/grillstorm/**"
      - "codex/grillstorm/**"
      - "codex/install.sh"
  pull_request:
    paths:
      - ".github/workflows/grillstorm.yml"
      - ".claude-plugin/marketplace.json"
      - "claude/grillstorm/**"
      - "codex/grillstorm/**"
      - "codex/install.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test Claude skill
        run: python -m pytest -q claude/grillstorm/skills/grillstorm/scripts
      - name: Test Codex skill
        run: python -m pytest -q codex/grillstorm/scripts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Claude and Codex parity
        run: >-
          diff -qr
          --exclude=agents
          --exclude=__pycache__
          --exclude=.pytest_cache
          claude/grillstorm/skills/grillstorm
          codex/grillstorm
      - name: Verify release versions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          local = json.loads(Path("claude/grillstorm/.claude-plugin/marketplace.json").read_text())
          plugin = json.loads(Path("claude/grillstorm/.claude-plugin/plugin.json").read_text())
          root_version = next(item["version"] for item in root["plugins"] if item["name"] == "grillstorm")
          local_version = next(item["version"] for item in local["plugins"] if item["name"] == "grillstorm")
          versions = {root_version, local_version, plugin["version"]}
          if len(versions) != 1:
              raise SystemExit(f"Grillstorm version mismatch: {sorted(versions)}")
          print(f"Grillstorm version: {plugin['version']}")
          PY
      - name: Verify explicit-only invocation policy
        run: |
          grep -q '^disable-model-invocation: true$' claude/grillstorm/skills/grillstorm/SKILL.md
          grep -q '^  allow_implicit_invocation: false$' codex/grillstorm/agents/openai.yaml
      - name: Smoke-test Codex installation
        run: |
          mkdir -p shared/mcp-ai-gateway/node_modules
          smoke_home="$(mktemp -d)"
          HOME="$smoke_home" bash codex/install.sh
          test -L "$smoke_home/.codex/skills/grillstorm"
          test -f "$smoke_home/.codex/skills/grillstorm/SKILL.md"
          test -L "$smoke_home/.codex/skills/megastorm"
          test -L "$smoke_home/.codex/skills/cross-exam"
